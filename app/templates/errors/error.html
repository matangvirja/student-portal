{% extends "layouts/public.html" %}
{% block title %}{{ title }} · Student Portal{% endblock %}
{% block body %}
<div class="err-wrap">
  <div class="err-card">
    <div class="code">{{ code }}</div>

  </div>
</div>
{% endblock %}
