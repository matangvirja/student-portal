# Run by AWS CodeBuild in the "Build" stage of CodePipeline.
# REPOSITORY_URI is provided by the CodeBuild project (infra/02-pipeline.yaml).
version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
      - COMMIT_SHORT="$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)"
      - IMAGE_TAG="${COMMIT_SHORT:-build-$CODEBUILD_BUILD_NUMBER}"
      - echo "Image tag will be $IMAGE_TAG"

  build:
    commands:
      - echo "Running unit tests (Docker 'test' stage) - a failure here stops the deployment"
      - docker build --target test -t portal-test .
      - echo "Building the runtime image"
      - docker build --target runtime -t "$REPOSITORY_URI:$IMAGE_TAG" -t "$REPOSITORY_URI:latest" .

  post_build:
    commands:
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:latest"
      # The ECS deploy action reads this file to know which image to roll out.
      - printf '[{"name":"web","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
